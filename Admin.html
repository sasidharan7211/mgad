<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Order Bills</title>
<style>
  :root {
    --bg: #e9e6df;
    --paper: #fffefb;
    --ink: #1c2230;
    --muted: #6d7384;
    --line: #d9d5ca;
    --accent: #1f4fd8;
    --ok: #12703a;
    --bad: #b3261e;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
    background: var(--bg);
    color: var(--ink);
  }
  .hidden { display: none !important; }

  /* LOGIN */
  #login { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .loginBox { background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 28px; width: 100%; max-width: 340px; }
  .loginBox h1 { margin: 0 0 6px; font-size: 22px; }
  .loginBox p { margin: 0 0 18px; color: var(--muted); font-size: 14px; }
  input[type=password], input[type=search], input[type=date] {
    width: 100%; padding: 11px 12px; border: 1px solid var(--line); border-radius: 6px;
    font: inherit; font-size: 16px; background: #fff; color: var(--ink);
  }
  input:focus-visible, button:focus-visible, a:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  button {
    font: inherit; cursor: pointer; border: 0; border-radius: 6px; padding: 9px 14px;
    background: var(--accent); color: #fff; font-weight: 600; font-size: 14px;
  }
  button.ghost { background: transparent; color: var(--ink); border: 1px solid var(--line); }
  .loginBox button { width: 100%; margin-top: 12px; padding: 11px; }
  #loginError { color: var(--bad); font-size: 14px; margin-top: 10px; min-height: 18px; }

  /* HEADER */
  header {
    display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between;
    padding: 12px 14px; background: var(--paper); border-bottom: 1px solid var(--line);
    position: sticky; top: 0; z-index: 5;
  }
  header h1 { margin: 0; font-size: 19px; }
  .actions { display: flex; gap: 8px; }
  main { max-width: 820px; margin: 0 auto; padding: 14px; }

  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 14px; }
  .stat { background: var(--paper); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; }
  .stat b { display: block; font-size: 20px; }
  .stat span { color: var(--muted); font-size: 12px; }

  .filters { display: grid; grid-template-columns: 1fr 160px; gap: 10px; margin-bottom: 10px; }
  .toolbar { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 12px; }
  #status { color: var(--muted); font-size: 13px; }

  /* BILL */
  .bill {
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 6px;
    margin-bottom: 16px;
    position: relative;
    box-shadow: 0 1px 0 var(--line), 0 6px 14px -10px rgba(28, 34, 48, .35);
  }
  .bill > summary {
    list-style: none;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 12px 16px;
  }
  .bill > summary::-webkit-details-marker { display: none; }
  .sumLeft b { display: block; font-size: 15px; }
  .sumLeft span { color: var(--muted); font-size: 12px; }
  .sumRight { text-align: right; white-space: nowrap; }
  .sumRight b { display: block; color: var(--ok); font-size: 16px; }
  .sumRight span { color: var(--muted); font-size: 12px; }
  .bill[open] > summary { border-bottom: 2px dashed var(--line); }

  .billBody { padding: 16px; }
  .billHead { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
  .billHead h2 { margin: 0 0 2px; font-size: 18px; letter-spacing: .3px; }
  .billHead .meta { text-align: right; font-size: 13px; line-height: 1.6; }
  .billHead .meta b { font-size: 14px; }
  .muted { color: var(--muted); }

  .party {
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 10px 12px;
    margin-bottom: 14px;
    font-size: 14px;
    line-height: 1.55;
  }
  .party .label { color: var(--muted); font-size: 12px; margin-bottom: 2px; }
  .party .nm { font-weight: 700; font-size: 15px; }
  .party a { color: var(--accent); font-weight: 600; text-decoration: none; }

  table.items { width: 100%; border-collapse: collapse; font-size: 14px; }
  table.items th {
    text-align: left; font-size: 12px; color: var(--muted); font-weight: 600;
    padding: 6px 4px; border-bottom: 1px solid var(--ink);
  }
  table.items td { padding: 9px 4px; border-bottom: 1px dotted var(--line); vertical-align: top; }
  table.items .r { text-align: right; white-space: nowrap; }
  table.items .c { text-align: center; }
  table.items .sn { width: 28px; color: var(--muted); }

  .totalRow {
    display: flex; justify-content: space-between; align-items: baseline;
    margin-top: 10px; padding-top: 10px; border-top: 2px solid var(--ink);
    font-size: 17px; font-weight: 700;
  }
  .totalRow .amt { font-size: 22px; color: var(--ok); }
  .itemsCount { color: var(--muted); font-size: 13px; margin-top: 4px; }

  .billActions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
  .billActions a.btn {
    display: inline-block; text-decoration: none; padding: 9px 14px; border-radius: 6px;
    background: #25a244; color: #fff; font-weight: 600; font-size: 14px;
  }
  .empty { padding: 30px; text-align: center; color: var(--muted); }

  @media (max-width: 520px) {
    main { padding: 10px; }
    .filters { grid-template-columns: 1fr; }
    .billHead .meta { text-align: left; }
    .billBody { padding: 12px; }
    table.items { font-size: 13px; }
    .stat b { font-size: 17px; }
  }

  /* PRINT: only the chosen bill */
  @media print {
    body { background: #fff; }
    header, .stats, .filters, .toolbar, .billActions, #login { display: none !important; }
    body.printOne .bill { display: none; }
    body.printOne .bill.printTarget { display: block; box-shadow: none; border: 0; }
    .bill > summary { display: none; }
    main { padding: 0; max-width: none; }
  }
</style>
</head>
<body>

<section id="login">
  <div class="loginBox">
    <h1>Order Bills</h1>
    <p>Enter your admin password to see orders.</p>
    <input type="password" id="keyInput" placeholder="Admin password" autocomplete="current-password">
    <button id="loginBtn" type="button">Open orders</button>
    <div id="loginError"></div>
  </div>
</section>

<section id="app" class="hidden">
  <header>
    <h1>Order Bills</h1>
    <div class="actions">
      <button class="ghost" id="refreshBtn" type="button">Refresh</button>
      <button class="ghost" id="logoutBtn" type="button">Log out</button>
    </div>
  </header>
  <main>
    <div class="stats">
      <div class="stat"><b id="statOrders">0</b><span>Orders</span></div>
      <div class="stat"><b id="statRevenue">₹0</b><span>Order value</span></div>
      <div class="stat"><b id="statToday">0</b><span>Today</span></div>
    </div>

    <div class="filters">
      <input type="search" id="searchInput" placeholder="Search name, phone, district, product, order ID">
      <input type="date" id="dateInput" aria-label="Filter by date">
    </div>

    <div class="toolbar">
      <div id="status"></div>
      <button class="ghost" id="toggleAll" type="button">Expand all</button>
    </div>

    <div id="bills"></div>
  </main>
</section>

<script>
  // YOUR APPS SCRIPT URL
  const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxNSYReWJNFGyyeSjz1XGlW0MV_TOnHy-U6Fgxss1LJKTNZ7880tAv8nnTTldMtkHTpmQ/exec';

  const loginBox = document.getElementById('login');
  const appBox = document.getElementById('app');
  const keyInput = document.getElementById('keyInput');
  const loginError = document.getElementById('loginError');
  const billsEl = document.getElementById('bills');
  const statusEl = document.getElementById('status');
  const searchInput = document.getElementById('searchInput');
  const dateInput = document.getElementById('dateInput');
  const toggleAll = document.getElementById('toggleAll');

  let allOrders = [];
  let expanded = false;

  function esc(v) {
    return String(v ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }
  const money = n => '₹' + Number(n || 0).toLocaleString('en-IN');

  // "11-10-2026 04:35 PM" -> { date, time }
  function splitDate(value) {
    const s = String(value || '').trim();
    const i = s.indexOf(' ');
    return i === -1 ? { date: s, time: '' } : { date: s.slice(0, i), time: s.slice(i + 1) };
  }

  async function loadOrders(key) {
    statusEl.textContent = 'Loading orders...';
    try {
      const res = await fetch(SCRIPT_URL + '?key=' + encodeURIComponent(key));
      const data = await res.json();
      if (data.status !== 'success') return { ok: false };
      allOrders = data.orders || [];
      return { ok: true };
    } catch (err) {
      return { ok: false, network: true };
    }
  }

  async function login(key) {
    loginError.textContent = '';
    const btn = document.getElementById('loginBtn');
    btn.disabled = true;
    const result = await loadOrders(key);
    btn.disabled = false;
    if (!result.ok) {
      loginError.textContent = result.network
        ? 'Could not reach the server. Check your internet.'
        : 'Wrong password.';
      sessionStorage.removeItem('adminKey');
      return;
    }
    sessionStorage.setItem('adminKey', key);
    loginBox.classList.add('hidden');
    appBox.classList.remove('hidden');
    render();
  }

  function render() {
    const q = searchInput.value.toLowerCase().trim();
    // <input type=date> gives yyyy-mm-dd; orders use dd-mm-yyyy
    let dateFilter = '';
    if (dateInput.value) {
      const [y, m, d] = dateInput.value.split('-');
      dateFilter = d + '-' + m + '-' + y;
    }

    const list = allOrders.filter(o => {
      if (dateFilter && !String(o.date).startsWith(dateFilter)) return false;
      if (!q) return true;
      return [o.orderId, o.name, o.whatsapp, o.address, o.district, o.pincode,
        ...(o.products || []).map(p => p.name)].join(' ').toLowerCase().includes(q);
    });

    const todayStr = new Date().toLocaleDateString('en-GB').replace(/\//g, '-');
    document.getElementById('statOrders').textContent = allOrders.length;
    document.getElementById('statRevenue').textContent = money(allOrders.reduce((s, o) => s + (Number(o.total) || 0), 0));
    document.getElementById('statToday').textContent = allOrders.filter(o => String(o.date).startsWith(todayStr)).length;

    statusEl.textContent = list.length ? 'Showing ' + list.length + ' of ' + allOrders.length + ' bills' : '';

    if (!list.length) {
      billsEl.innerHTML = '<div class="empty">' + (allOrders.length ? 'No bills match your filters.' : 'No orders yet.') + '</div>';
      return;
    }

    billsEl.innerHTML = list.map((o, i) => {
      const dt = splitDate(o.date);
      const phone = esc(o.whatsapp);
      const products = o.products || [];
      const qty = products.reduce((s, p) => s + (Number(p.quantity) || 0), 0);
      const rows = products.map((p, n) => `
        <tr>
          <td class="sn">${n + 1}</td>
          <td>${esc(p.name)}</td>
          <td class="r">${money(p.price)}</td>
          <td class="c">${esc(p.quantity)}</td>
          <td class="r">${money(p.totalPrice)}</td>
        </tr>`).join('');
      const isOpen = expanded || i === 0;
      return `
      <details class="bill" data-id="${esc(o.orderId)}" ${isOpen ? 'open' : ''}>
        <summary>
          <div class="sumLeft"><b>${esc(o.name)}</b><span>${esc(o.orderId)} · ${esc(dt.date)} ${esc(dt.time)}</span></div>
          <div class="sumRight"><b>${money(o.total)}</b><span>${qty} item${qty === 1 ? '' : 's'}</span></div>
        </summary>
        <div class="billBody">
          <div class="billHead">
            <div>
              <h2>ORDER BILL</h2>
              <div class="muted">Order ID: <b>${esc(o.orderId)}</b></div>
            </div>
            <div class="meta">
              <div>Date: <b>${esc(dt.date)}</b></div>
              <div>Time: <b>${esc(dt.time)}</b></div>
            </div>
          </div>

          <div class="party">
            <div class="label">Bill to</div>
            <div class="nm">${esc(o.name)}</div>
            <div>WhatsApp: <a href="https://wa.me/91${phone}" target="_blank" rel="noopener">${phone}</a></div>
            <div>${esc(o.address)}</div>
            <div>${esc(o.district)} - ${esc(o.pincode)}</div>
          </div>

          <table class="items">
            <thead><tr><th>#</th><th>Product</th><th class="r">Price</th><th class="c">Qty</th><th class="r">Amount</th></tr></thead>
            <tbody>${rows}</tbody>
          </table>

          <div class="totalRow"><span>Grand Total</span><span class="amt">${money(o.total)}</span></div>
          <div class="itemsCount">${qty} item${qty === 1 ? '' : 's'} · ${products.length} product${products.length === 1 ? '' : 's'}</div>

          <div class="billActions">
            <a class="btn" href="https://wa.me/91${phone}" target="_blank" rel="noopener">WhatsApp customer</a>
            <button class="ghost" type="button" data-print="${esc(o.orderId)}">Print bill</button>
          </div>
        </div>
      </details>`;
    }).join('');
  }

  // PRINT ONE BILL
  billsEl.addEventListener('click', e => {
    const btn = e.target.closest('[data-print]');
    if (!btn) return;
    const bill = btn.closest('.bill');
    bill.open = true;
    bill.classList.add('printTarget');
    document.body.classList.add('printOne');
    window.print();
    document.body.classList.remove('printOne');
    bill.classList.remove('printTarget');
  });

  // EVENTS
  document.getElementById('loginBtn').addEventListener('click', () => login(keyInput.value.trim()));
  keyInput.addEventListener('keydown', e => { if (e.key === 'Enter') login(keyInput.value.trim()); });
  searchInput.addEventListener('input', render);
  dateInput.addEventListener('input', render);
  toggleAll.addEventListener('click', () => {
    expanded = !expanded;
    toggleAll.textContent = expanded ? 'Collapse all' : 'Expand all';
    render();
    if (!expanded) billsEl.querySelectorAll('.bill').forEach((b, i) => { b.open = i === 0; });
  });
  document.getElementById('refreshBtn').addEventListener('click', async () => {
    const result = await loadOrders(sessionStorage.getItem('adminKey') || '');
    if (!result.ok) statusEl.textContent = 'Refresh failed. Log in again.';
    else render();
  });
  document.getElementById('logoutBtn').addEventListener('click', () => {
    sessionStorage.removeItem('adminKey');
    allOrders = [];
    billsEl.innerHTML = '';
    keyInput.value = '';
    appBox.classList.add('hidden');
    loginBox.classList.remove('hidden');
  });

  const saved = sessionStorage.getItem('adminKey');
  if (saved) login(saved);
</script>
</body>
</html>
